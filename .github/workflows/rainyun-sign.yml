name: Rainyun 自动签到

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 4:00 = 北京时间 12:00 执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sign-in:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # 允许删除缓存
    steps:
      - uses: actions/checkout@v4  # ✅ 升级到 v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5  # ✅ 升级到 v5
        with:
          python-version: '3.10'  # ✅ 修正版本写法
          cache: 'pip'  # ✅ 启用 pip 缓存
      
      - name: 缓存 Python 依赖
        uses: actions/cache@v4  # ✅ 升级到 v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 安装 Chrome 和 ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable curl unzip jq
          
          CHROME_FULL_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          CHROME_MILESTONE=$(echo "$CHROME_FULL_VERSION" | cut -d'.' -f1)
          echo "Chrome 完整版本: $CHROME_FULL_VERSION"
          echo "Chrome 里程碑版本: $CHROME_MILESTONE"
          
          CHROMEDRIVER_VERSION=""
          
          JSON_DATA=$(curl -sS "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json")
          if [ -n "$JSON_DATA" ]; then
            CHROMEDRIVER_VERSION=$(echo "$JSON_DATA" | jq -r --arg ver "$CHROME_FULL_VERSION" '.versions[] | select(.version == $ver) | .downloads.chromedriver[] | select(.platform == "linux64") | .url' | head -1)
            if [ -n "$CHROMEDRIVER_VERSION" ]; then
              echo "找到匹配的 ChromeDriver 下载链接"
              curl -sS -o /tmp/chromedriver.zip "$CHROMEDRIVER_VERSION"
              unzip -o /tmp/chromedriver.zip -d /tmp/
              sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver 2>/dev/null || sudo mv /tmp/chromedriver /usr/local/bin/chromedriver 2>/dev/null
              sudo chmod +x /usr/local/bin/chromedriver
              echo "ChromeDriver 安装完成：$(chromedriver --version)"
            fi
          fi
          
          if [ -z "$CHROMEDRIVER_VERSION" ]; then
            echo "尝试使用里程碑版本查找..."
            LATEST_VERSION=$(curl -sS "https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone.json" | jq -r ".milestones.\"$CHROME_MILESTONE\".version" 2>/dev/null)
            if [ -n "$LATEST_VERSION" ] && [ "$LATEST_VERSION" != "null" ]; then
              echo "里程碑 $CHROME_MILESTONE 最新版本: $LATEST_VERSION"
              DRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/${LATEST_VERSION}/linux64/chromedriver-linux64.zip"
              echo "下载 URL: $DRIVER_URL"
              curl -sS -o /tmp/chromedriver.zip "$DRIVER_URL"
              unzip -o /tmp/chromedriver.zip -d /tmp/
              sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
              sudo chmod +x /usr/local/bin/chromedriver
              echo "ChromeDriver 安装完成：$(chromedriver --version)"
            else
              echo "无法获取 ChromeDriver 版本，尝试使用系统默认"
              which chromedriver && chromedriver --version || echo "系统无默认 chromedriver"
            fi
          fi
      
      - name: 生成用户名哈希
        id: hash
        run: |
          USER_HASH=$(echo -n "${{ secrets.RAINYUN_USER }}" | sha256sum | cut -c1-16)
          echo "user_hash=$USER_HASH" >> $GITHUB_OUTPUT
      
      - name: 清理旧 Cookie 缓存
        run: |
          gh cache list --key "rainyun-cookies-${{ steps.hash.outputs.user_hash }}-" --json key,id --jq '.[] | .id' | tail -n +2 | xargs -r gh cache delete || true
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 确保 temp 目录存在
        run: mkdir -p temp/cookies
      
      - name: 恢复 Cookie 缓存
        uses: actions/cache/restore@v4
        with:
          path: temp/cookies
          key: rainyun-cookies-${{ steps.hash.outputs.user_hash }}-${{ github.run_id }}
          restore-keys: |
            rainyun-cookies-${{ steps.hash.outputs.user_hash }}-
      
      - name: 执行签到脚本
        run: python rainyun.py
        env:
          # 启用随机延时（避免固定节奏被识别）
          RANDOM_DELAY: "true"
          # 增加浏览器等待时间
          PAGE_LOAD_TIMEOUT: "30"
          # 启用更真实的 User-Agent 轮换
          ROTATE_USER_AGENT: "true"
          # 添加鼠标模拟（如果脚本支持）
          SIMULATE_MOUSE: "true"
          RAINYUN_USER: ${{ secrets.RAINYUN_USER }}
          RAINYUN_PASS: ${{ secrets.RAINYUN_PASS }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_NAME: ${{ secrets.SMTP_NAME }}
          BARK_PUSH: ${{ secrets.BARK_PUSH }}
          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}
          FSKEY: ${{ secrets.FSKEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          HEADLESS: "true"
          DEBUG: "false"
          CHROMEDRIVER_PATH: "chromedriver"
          MAX_WORKERS: "2"
          MAX_RETRIES: "1"
      
      - name: 保存 Cookie 缓存
        uses: actions/cache/save@v4
        if: always() && hashFiles('temp/cookies/**') != ''
        with:
          path: temp/cookies
          key: rainyun-cookies-${{ steps.hash.outputs.user_hash }}-${{ github.run_id }}
      
      - name: 清理临时文件
        run: rm -rf temp
        if: always()

  keepalive:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: sign-in
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
        with:
          token: ${{ github.token }}
